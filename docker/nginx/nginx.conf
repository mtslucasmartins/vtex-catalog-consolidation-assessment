events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Docker embedded DNS — resolve upstreams at request time so nginx starts
    # even when backend containers are not up yet.
    resolver 127.0.0.11 ipv6=off valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 55M;

        location = / {
            default_type text/plain;
            return 200 'Catalog Consolidation gateway\n\n/grafana/\n/ingester/\n/worker/\n';
        }

        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            set $grafana_upstream http://grafana:3000;
            # Keep /grafana/ prefix — Grafana runs with GF_SERVER_SERVE_FROM_SUB_PATH.
            proxy_pass $grafana_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location = /ingester {
            return 301 /ingester/;
        }

        location /ingester/ {
            set $ingester_upstream http://ms-catalog-consolidation-ingester:9090;
            rewrite ^/ingester/?(.*)$ /$1 break;
            proxy_pass $ingester_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /ingester;
        }

        location = /worker {
            return 301 /worker/;
        }

        location /worker/ {
            set $worker_upstream http://ms-catalog-consolidation-worker:9091;
            rewrite ^/worker/?(.*)$ /$1 break;
            proxy_pass $worker_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /worker;
        }
    }
}
