global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ingester
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ms-catalog-consolidation-ingester:9090]

  - job_name: worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ms-catalog-consolidation-worker:9091]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: [redpanda:9644]
